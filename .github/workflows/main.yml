name: Fabricar APK

on:
  push:
    branches: [ "main", "master", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar entorno Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generar proyecto Android
        run: |
          flutter create . --platforms=android --org com.example --overwrite
          flutter pub add firebase_core cloud_firestore firebase_auth

      - name: Parchear Gradle Android
        run: |
          python3 -c "
          import os
          for root, _, files in os.walk('android'):
              for f in files:
                  if f in ['build.gradle', 'build.gradle.kts'] and 'app' in root:
                      path = os.path.join(root, f)
                      with open(path, 'r') as file:
                          txt = file.read()
                      txt = txt.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 34')
                      txt = txt.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 34')
                      txt = txt.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 21')
                      txt = txt.replace('minSdk = flutter.minSdkVersion', 'minSdk = 21')
                      with open(path, 'w') as file:
                          file.write(txt)
          "

      - name: Limpiar y obtener paquetes
        run: |
          flutter clean
          flutter pub get

      - name: Compilar APK Release
        run: flutter build apk --release --no-tree-shake-icons

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
