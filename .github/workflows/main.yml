name: Fabricar APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Java (necesario para Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generar y configurar Android para Firebase
        run: |
          flutter create . --platforms=android --org com.example
          python3 -c "
          import re
          path = 'android/app/build.gradle'
          with open(path, 'r') as f:
              content = f.read()
          content = re.sub(r'minSdkVersion\s+.*', 'minSdkVersion 21', content)
          content = re.sub(r'minSdk\s*=.*', 'minSdk = 21', content)
          if 'multiDexEnabled' not in content:
              content = re.sub(r'(defaultConfig\s*\{)', r'\1\n        multiDexEnabled true', content)
          with open(path, 'w') as f:
              f.write(content)
          "
          flutter pub get

      - name: Construir el archivo APK
        run: flutter build apk --release

      - name: Guardar el APK para descargarlo
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk