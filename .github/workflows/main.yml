name: Fabricar APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Java (necesario para Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generar carpeta nativa de Android
        run: flutter create . --platforms=android --project-name=gestor_casa

      - name: Preparar la app
        run: flutter pub get

      - name: Construir el archivo APK
        run: flutter build apk --release

      - name: Guardar el APK para descargarlo
        uses: actions/upload-artifact@v4
        with:
          name: app-casa-apk
          path: build/app/outputs/flutter-apk/app-release.apk
