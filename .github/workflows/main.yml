name: Fabricar APK

on:
  push:
    branches: [ "main", "master", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar entorno Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Preparar entorno limpio y respaldar main.dart
        run: |
          mkdir -p /tmp/app_backup
          if [ -f lib/main.dart ]; then
            cp lib/main.dart /tmp/app_backup/main.dart
          fi
          
          flutter create . --platforms=android --org com.example --overwrite
          
          rm -rf lib/*
          if [ -f /tmp/app_backup/main.dart ]; then
            cp /tmp/app_backup/main.dart lib/main.dart
          fi
          
          flutter pub add firebase_core cloud_firestore firebase_auth

      - name: Parchear Gradle Android para Firebase (SDK 34 y MinSDK 21)
        run: |
          python3 -c "
          import os, re
          for root, _, files in os.walk('android'):
              for f in files:
                  if f in ['build.gradle', 'build.gradle.kts'] and 'app' in root:
                      path = os.path.join(root, f)
                      with open(path, 'r') as file:
                          txt = file.read()
                      txt = re.sub(r'compileSdkVersion\s+.*', 'compileSdkVersion 34', txt)
                      txt = re.sub(r'compileSdk\s*=\s*.*', 'compileSdk = 34', txt)
                      txt = re.sub(r'minSdkVersion\s+.*', 'minSdkVersion 21', txt)
                      txt = re.sub(r'minSdk\s*=\s*.*', 'minSdk = 21', txt)
                      with open(path, 'w') as file:
                          file.write(txt)
          "

      - name: Limpiar y obtener dependencias
        run: |
          flutter clean
          flutter pub get

      - name: Compilar APK Release
        run: flutter build apk --release --no-tree-shake-icons

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
