name: Compilar APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar entorno Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Limpiar y recrear estructura Flutter
        run: |
          mkdir -p /tmp/app_backup
          [ -f lib/main.dart ] && cp lib/main.dart /tmp/app_backup/main.dart
          flutter create . --platforms=android --org com.example --overwrite
          [ -f /tmp/app_backup/main.dart ] && cp /tmp/app_backup/main.dart lib/main.dart
          flutter pub add firebase_core cloud_firestore firebase_auth

      - name: Obtener dependencias
        run: flutter pub get

      - name: Verificar sintaxis Dart
        run: flutter analyze || true

      - name: Compilar APK Release
        run: flutter build apk --release --no-tree-shake-icons

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
